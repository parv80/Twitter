version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - appnet

  backend:
    build: ./server
    container_name: twitter-backend
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    networks:
      - appnet

  frontend:
    build: ./client
    container_name: twitter-frontend
    ports:
      - "3005:80"
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  mongo-data:

networks:
  appnet:
